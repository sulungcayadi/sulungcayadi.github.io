<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sulung Cayadi</title>
<meta name="description" content="Sulung Cayadi — personal site at sulungcayadi.space.">
<link rel="icon" href="data:,">
<style>
  :root { --bg: #f6f7f9; --card: #ffffff; --ink: #14202e; --muted: #5b6b7c; --accent: #0e7c86; --line: #dde3ea; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f151c; --card: #17202a; --ink: #e8eef4; --muted: #9aa9b8; --accent: #3cc0c9; --line: #263342; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px;
         font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--ink); }
  main { width: 100%; max-width: 560px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 36px 32px; }
  h1 { margin: 0 0 4px; font-size: 1.9rem; letter-spacing: -0.01em; }
  .domain { margin: 0 0 20px; color: var(--accent); font-weight: 600; }
  p { margin: 0 0 14px; color: var(--muted); }
  a { color: var(--accent); }
  footer { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); font-size: .85rem; color: var(--muted); }
</style>
</head>

<main>
  <h1>Sulung Cayadi</h1>
